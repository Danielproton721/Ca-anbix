    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- n8n Chat Widget -->
    <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
    <style>
      :root {
        --chat--color-primary: #FF6B00;
        --chat--color-primary-shade-50: #E55F00;
        --chat--color-primary-shade-100: #CC5500;
        --chat--color-secondary: #FFC107;
        --chat--color-secondary-shade-50: #E0A800;
        --chat--color-white: #FFFFFF;
        --chat--color-light: #F3F4F6;
        --chat--color-light-shade-50: #E5E7EB;
        --chat--color-light-shade-100: #D1D5DB;
        --chat--color-medium: #4B5563;
        --chat--color-dark: #3B3E42;
        --chat--color-disabled: #9CA3AF;
        --chat--color-typing: #4B5563;
        --chat--spacing: 1rem;
        --chat--border-radius: 0.75rem;
        --chat--transition-duration: 0.15s;
        --chat--window--width: 400px;
        --chat--window--height: 600px;
        --chat--header--padding: var(--chat--spacing);
        --chat--header--background: var(--chat--color-primary);
        --chat--header--color: var(--chat--color-white);
        --chat--header--border-top: none;
        --chat--header--border-bottom: none;
        --chat--textarea--height: 50px;
        --chat--message--bot--background: var(--chat--color-light);
        --chat--message--bot--color: var(--chat--color-dark);
        --chat--message--user--background: var(--chat--color-primary);
        --chat--message--user--color: var(--chat--color-white);
        --chat--message--pre--background: rgba(0, 0, 0, 0.05);
        --chat--toggle--background: var(--chat--color-primary);
        --chat--toggle--hover--background: var(--chat--color-primary-shade-50);
        --chat--toggle--active--background: var(--chat--color-primary-shade-100);
        --chat--toggle--color: var(--chat--color-white);
        --chat--toggle--size: 64px;
        --chat--button--background: var(--chat--color-primary);
        --chat--button--hover--background: var(--chat--color-primary-shade-50);
        --chat--button--active--background: var(--chat--color-primary-shade-100);
        --chat--button--color: var(--chat--color-white);
      }
    </style>
    <script type="module">
      import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';
      createChat({
        webhookUrl: 'https://alessadra498.app.n8n.cloud/webhook/locabem-site-chat-webhook/chat',
        mode: 'window',
        showWelcomeScreen: true,
        initialMessages: [
          'Olá! Sou o assistente da LOCA BEM. Como posso ajudar você hoje?'
        ],
        i18n: {
          pt: {
            title: 'LOCA BEM',
            subtitle: 'Tire suas dúvidas conosco!',
            footer: '',
            getStarted: 'Iniciar Conversa',
            inputPlaceholder: 'Digite sua mensagem...',
            closeButtonTooltip: 'Fechar'
          }
        },
        defaultLanguage: 'pt'
      });
    </script>
